name: Verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[mcp]'
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -c 'from datahub_lineage_agent import StdioDataHubMCP; print("MCP adapter import verified")'
      - run: python -m compileall -q src
