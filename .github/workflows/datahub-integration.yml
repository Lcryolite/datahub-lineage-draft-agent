name: DataHub MCP Integration

on:
  workflow_dispatch:

concurrency:
  group: datahub-mcp-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # DataHub's current quickstart CLI documents and actively tests Python 3.10–3.11.
          python-version: "3.11"
      - run: python -m pip install -e '.[mcp]' acryl-datahub
      - name: Start official DataHub quickstart
        run: timeout 12m datahub docker quickstart --accept-version-default
      # Quickstart's local GMS is unauthenticated by default. `datahub init`
      # unnecessarily attempts PAT creation and currently fails on this stack.
      - run: datahub datapack load showcase-ecommerce
        env:
          DATAHUB_GMS_URL: http://localhost:8080
      - run: python scripts/mcp_smoke.py
        env:
          DATAHUB_GMS_URL: http://localhost:8080
      - if: always()
        name: Report container state
        run: docker ps -a
      - if: always()
        run: datahub docker quickstart --stop || true
